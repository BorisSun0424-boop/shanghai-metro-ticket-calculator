<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上海地铁计次票计算器</title>
<style>
:root{
  --bg:#f4f7f3; --card:#ffffff; --ink:#15241b; --muted:#68786d;
  --line:#dce6de; --green:#00864a; --green-soft:#e7f5ec; --green-deep:#005f36;
  --amber:#a96500; --amber-soft:#fff4e0; --red:#b42318; --shadow:0 10px 30px rgba(17,45,29,.08);
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink);
  background:
    radial-gradient(1100px 500px at 15% -8%, #dff3e7 0, rgba(223,243,231,0) 60%),
    radial-gradient(900px 450px at 95% 0%, #fdf0d9 0, rgba(253,240,217,0) 55%),
    var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 56px}
header{padding:6px 2px 18px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);color:var(--green-deep);font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
h1{font-size:30px;line-height:1.18;margin:14px 0 8px;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;line-height:1.65;margin:0}
.card{background:var(--card);border:1px solid rgba(220,230,222,.9);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-top:16px}
.card h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);font-size:12px;align-items:center;justify-content:center;font-weight:800}
.field{margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px}
input{
  width:100%;height:48px;border:1px solid var(--line);background:#fbfdfb;border-radius:13px;
  padding:0 13px;font-size:16px;color:var(--ink);outline:none;transition:.15s;
}
input:focus{border-color:#7fcfa2;background:#fff;box-shadow:0 0 0 4px rgba(0,134,74,.08)}
input::placeholder{color:#a5b2a9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dest-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.dest-head span{font-size:13px;font-weight:800;color:var(--ink)}
.link-btn{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:700;padding:4px;cursor:pointer}
.dest-row{display:grid;grid-template-columns:1fr 86px 30px;gap:8px;align-items:center;margin-bottom:9px}
.dest-row input{height:44px;font-size:15px}
.dest-row .visits{text-align:center;padding:0 6px}
.remove{border:0;background:#f3f6f4;color:#8a978f;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer}
.remove:hover{background:#feeceb;color:var(--red)}
.add{border:1px dashed #b9d9c7;background:#f5fbf7;color:var(--green-deep);width:100%;height:42px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:2px}
.add:hover{background:var(--green-soft)}
.calc{
  width:100%;height:54px;border:0;border-radius:15px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,#009a54,#00713f);color:#fff;font-size:17px;font-weight:800;
  box-shadow:0 10px 22px rgba(0,134,74,.24);letter-spacing:.3px;
}
.calc:active{transform:translateY(1px);box-shadow:0 5px 12px rgba(0,134,74,.18)}
.hint{font-size:11px;color:#8a978f;line-height:1.6;margin:10px 2px 0}
.error{display:none;margin-top:12px;background:#fff1f0;border:1px solid #ffd4d0;color:#a51d13;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.55}
.hidden{display:none!important}
.rec{background:linear-gradient(135deg,#007a43,#006337);color:#fff;border-radius:18px;padding:20px 18px;position:relative;overflow:hidden}
.rec:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-55px;top:-60px;background:rgba(255,255,255,.1)}
.rec-kicker{font-size:11px;letter-spacing:1.4px;opacity:.75;font-weight:800}
.rec-title{font-size:27px;line-height:1.2;font-weight:850;margin:8px 0 8px;letter-spacing:-.4px}
.rec-sub{font-size:13px;line-height:1.65;opacity:.9;max-width:92%}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metric{background:#f7faf8;border:1px solid #e4ede6;border-radius:14px;padding:12px}
.metric .k{font-size:11px;color:var(--muted);font-weight:700}
.metric .v{font-size:22px;font-weight:850;margin-top:4px;letter-spacing:-.4px}
.metric .u{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.metric.good .v{color:var(--green-deep)}
.section-title{font-size:14px;font-weight:850;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title:before{content:"";width:4px;height:15px;border-radius:3px;background:var(--green)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
th{background:#f6faf7;color:#4f6356;text-align:left;font-weight:800;padding:10px 11px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px;border-bottom:1px solid #edf3ee;vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:0}
td.num-cell{white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}
.pill.good{background:var(--green-soft);color:var(--green-deep)}
.pill.bad{background:#fff0ee;color:var(--red)}
.pill.flat{background:var(--amber-soft);color:var(--amber)}
.path{font-size:11px;color:#7a8b80;line-height:1.55;margin-top:4px}
.note{background:#fbfdfb;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:12px;color:#62736a;line-height:1.75;margin-top:14px}
.note b{color:var(--ink)}
footer{color:#8b9a90;font-size:11px;line-height:1.7;text-align:center;padding:26px 8px 0}
@media(max-width:560px){
  h1{font-size:26px}
  .grid,.grid3,.metrics{grid-template-columns:1fr 1fr}
  .dest-row{grid-template-columns:1fr 76px 30px}
  .rec-title{font-size:24px}
}
@media(max-width:390px){
  .grid,.grid3,.metrics{grid-template-columns:1fr}
  .dest-row{grid-template-columns:1fr 70px 30px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge"><span class="dot"></span>上海地铁 · 2026.12.1 新票价</div>
    <h1>计次票，到底该不该买？</h1>
    <p class="sub">输入你的起点、终点和常去站点，自动算每月车费、该买哪档计次票，以及能省多少。</p>
  </header>

  <section class="card">
    <h2><span class="num">1</span>填你的出行</h2>
    <div class="grid">
      <div class="field">
        <label>起点站（家 / 公司）</label>
        <input id="start" list="stationList" placeholder="例如：莘庄" autocomplete="off">
      </div>
      <div class="field">
        <label>终点站（公司 / 学校）</label>
        <input id="end" list="stationList" placeholder="例如：人民广场" autocomplete="off">
      </div>
    </div>
    <div class="grid3">
      <div class="field">
        <label>每月通勤天数</label>
        <input id="days" type="number" min="1" max="31" value="22" inputmode="numeric">
      </div>
      <div class="field">
        <label>每天往返次数</label>
        <input id="trips" type="number" min="1" max="4" value="2" inputmode="numeric">
      </div>
    </div>

    <div class="dest-head">
      <span>平时常去的站点</span>
      <button class="link-btn" id="addDest" type="button">+ 添加</button>
    </div>
    <div id="destList"></div>
    <p class="hint">“每月去几次”按往返算：去 4 次 = 8 次单程。没有常去站点可留空。</p>

    <button class="calc" id="calc" type="button">算我的购买方案</button>
    <div class="error" id="error"></div>
    <p class="hint">不用查官方票价表，直接填站名；覆盖上海地铁 415 个普通计价站点（不含磁浮、市域机场线）。</p>
  </section>

  <section id="result" class="card hidden" aria-live="polite"></section>

  <footer>
    数据说明：按上海地铁官方站点坐标与线路顺序计算最短路径，票价按 2026.12.1 新机制；结果为估算，实际以官方查询与闸机扣费为准。
  </footer>
</div>

<datalist id="stationList"></datalist>

const stations = DATA.stations;

function resolveStation(raw) {
  let s = (raw || '').trim().replace(/\s+/g, '');
  if (!s) return null;
  if (stations[s]) return s;
  if (alias.has(s)) return alias.get(s);
  const noParen = s.replace(/\([^)]*\)/g, '').trim();
  if (alias.has(noParen)) return alias.get(noParen);
  if (s.endsWith('站') && alias.has(s.slice(0, -1))) return alias.get(s.slice(0, -1));

function shortest(start, end) {
  // Optimise for distance plus a small transfer penalty, so a direct line
  // wins over a shorter route that forces two pointless transfers.
  const dist = Object.create(null);
  const prev = Object.create(null);
  const pq = [[0, start, null]];
  const key = (s, line) => s + '|' + (line || '');
  dist[key(start, null)] = 0;
  let endKey = null;
  while (pq.length) {
    pq.sort((a,b)=>a[0]-b[0]);

    const uKey = key(u, line);

    if (u === end) { endKey = uKey; break; }
    for (const e of graph[u] || []) {

      const nd = d + e.km + transfer;
      const nKey = key(e.to, e.line);
      if (!(nKey in dist) || nd < dist[nKey] - 1e-9) {
        dist[nKey] = nd;
        prev[nKey] = {u, line, edge:e};

    edges.push(p.edge);
    cur = key(p.u, p.line);
  }
  edges.reverse();
  const km = edges.reduce((s,e)=>s+e.km, 0);
  return {km, edges};
}

function fareNew(km) {

  return Math.min(15, 10 + Math.ceil((km - 50) / 15));

  if (km <= 6) return 3;

  for (const e of edges) {
    const last = segs[segs.length - 1];
    if (last && last.line === e.line) last.to = e.toName;
    else segs.push({line:e.line, from:e.from, to:e.toName});
  }
  return segs.map(s => `${s.line} ${s.from} → ${s.to}`).join('；');
}

function paygCost(fares) {
  let spent = 0, cost = 0;
  for (const f of fares) {
    const pay = spent >= 90 ? f * 0.9 : f;
    cost += pay;
    spent += pay;
  }
  return Math.round(cost * 100) / 100;
}

const PACKS = [
  {n:35, price:190},
  {n:45, price:210},
  {n:60, price:270},
  {n:90, price:390}
];

function planCost(packs, rides, fares) {
  const covered = packs.reduce((s,p)=>s+p.n,0);
  const packCost = packs.reduce((s,p)=>s+p.price,0);
  if (covered >= rides) return Math.round(packCost * 100) / 100;
  const sorted = [...fares].sort((a,b)=>b-a); // pack covers the most expensive rides
  const singles = sorted.slice(covered, rides).reduce((s,f)=>s+f,0);
  return Math.round((packCost + singles) * 100) / 100;
}

function planLabel(packs, rides) {
  if (!packs.length) return '不买计次票';
  const covered = packs.reduce((s,p)=>s+p.n,0);
  const base = packs.length === 1 ? `${packs[0].n}次票` : packs.map(p=>`${p.n}次`).join('+') + '组合';
  if (covered < rides) return `${base} + ${rides-covered}次单买`;
  return base;
}

function addDestRow(station = '', visits = 4) {
  const list = document.getElementById('destList');
  const row = document.createElement('div');
  row.className = 'dest-row';
  row.innerHTML = `
    <input class="dest-station" list="stationList" placeholder="例如：徐家汇" autocomplete="off">
    <input class="dest-visits" type="number" min="0" max="60" value="4" inputmode="numeric" aria-label="每月往返次数">
    <button class="remove" type="button" aria-label="删除">×</button>`;
  row.querySelector('.dest-station').value = station;
  row.querySelector('.dest-visits').value = visits;
  row.querySelector('.remove').addEventListener('click', () => {
    row.remove();
    if (!list.children.length) addDestRow();
  });
  list.appendChild(row);
}

function seedDatalist() {
  const dl = document.getElementById('stationList');
  dl.innerHTML = stationNames.map(n => `<option value="${esc(n)}"></option>`).join('');
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('result').classList.add('hidden');
}
function clearError() {
  const el = document.getElementById('error');
  el.style.display = 'none';
}
function round1(n) { return Math.round(n * 10) / 10; }

function buildLegs(start, end, commuteRides, dests) {
  const legs = [];
  const add = (from, to, rides, label) => {
    const route = shortest(from, to);
    if (!route) throw new Error(`查不到 ${from} → ${to} 的路线，请检查站名。`);
    legs.push({
      label, from, to, rides,
      km: route.km,
      fare: fareNew(route.km),
      oldFare: fareOld(route.km),
      path: pathText(route.edges)
    });
  };
  if (commuteRides > 0) add(start, end, commuteRides, '通勤');
  for (const d of dests) add(start, d.station, d.visits * 2, `常去 · ${d.station}`);
  return legs;
}

function render(legs, start, end) {
  const totalRides = legs.reduce((s,l)=>s+l.rides, 0);
  const fares = [];
  for (const l of legs) for (let i=0;i<l.rides;i++) fares.push(l.fare);
  const payg = paygCost(fares);
  const original = fares.reduce((s,f)=>s+f, 0);

  let best = {type:'payg', cost:payg, label:'不买计次票', packs:[]};
  for (let a=0;a<=2;a++) for (let b=0;b<=2;b++) for (let c=0;c<=2;c++) for (let d=0;d<=2;d++) {
    const packs = [];
    if (a) packs.push({...PACKS[0], qty:a});
    if (b) packs.push({...PACKS[1], qty:b});
    if (c) packs.push({...PACKS[2], qty:c});
    if (d) packs.push({...PACKS[3], qty:d});
    if (!packs.length) continue;
    const expanded = [];
    for (const p of packs) for (let i=0;i<p.qty;i++) expanded.push(p);
    const covered = expanded.reduce((s,p)=>s+p.n,0);
    if (covered > totalRides + 90) continue;
    const cost = planCost(expanded, totalRides, fares);
    if (cost < best.cost - 0.009) {
      best = {type:'ticket', cost, label:planLabel(expanded, totalRides), packs:expanded};
    }
  }

  const saving = Math.round((payg - best.cost) * 100) / 100;
  const unused = best.packs.reduce((s,p)=>s+p.n, 0) - totalRides;
  let title, sub;
  if (best.type === 'payg') {
    title = '不买计次票更划算';
    sub = `按你每月 ${totalRides} 次出行，刷码约 ¥${money(payg)}；买计次票省不出钱，别多买。`;
  } else if (saving < 5) {
    title = '买不买都差不多';
    sub = `推荐 ${best.label}，约 ¥${money(best.cost)}，和刷码只差 ¥${money(saving)}；用不完就别买。`;
  } else {
    title = `建议买 ${best.label}`;
    sub = `按你每月 ${totalRides} 次出行，买票约 ¥${money(best.cost)}，比刷码省 ¥${money(saving)}。` + (unused > 0 ? ` 这档会剩 ${unused} 次用不完，仍比单买划算。` : '');
  }

  const packRows = PACKS.map(p => {
    const cost = planCost([p], totalRides, fares);
    const diff = Math.round((payg - cost) * 100) / 100;
    const extra = totalRides > p.n
      ? `<div class="path">含 ${totalRides-p.n} 次单买</div>`
      : (totalRides < p.n ? `<div class="path">剩 ${p.n-totalRides} 次</div>` : '');
    const verdict = diff > 0 ? `<span class="pill good">省 ¥${money(diff)}</span>` : (Math.abs(diff) < 1 ? `<span class="pill flat">打平</span>` : `<span class="pill bad">多花 ¥${money(-diff)}</span>`);
    return `<tr>
      <td><b>${p.n}次票</b><br><span class="path">${p.price} 元</span>${extra}</td>
      <td class="num-cell">¥${money(cost)}</td>
      <td class="num-cell">¥${money(payg)}</td>
      <td>${verdict}</td>
    </tr>`;
  }).join('');

  const legRows = legs.map(l => `
    <tr>
      <td><b>${esc(l.label)}</b><div class="path">${esc(l.from)} → ${esc(l.to)}</div></td>
      <td class="num-cell">¥${l.fare}<div class="path">涨价前 ¥${l.oldFare}</div></td>
      <td class="num-cell">${l.rides} 次</td>
      <td class="num-cell">¥${money(l.fare * l.rides)}</td>
      <td><div class="path">${esc(l.path)}</div><div class="path">约 ${round1(l.km)} 公里</div></td>
    </tr>`).join('');

  const result = document.getElementById('result');
  result.classList.remove('hidden');
  result.innerHTML = `
    <div class="rec">
      <div class="rec-kicker">你的推荐方案</div>
      <div class="rec-title">${esc(title)}</div>
      <div class="rec-sub">${esc(sub)}</div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="k">每月乘车</div><div class="v">${totalRides}<span class="u">次</span></div></div>
      <div class="metric"><div class="k">不买票 · 9折后</div><div class="v">¥${money(payg)}</div></div>
      <div class="metric good"><div class="k">推荐方案</div><div class="v">¥${money(best.cost)}</div></div>
      <div class="metric good"><div class="k">每月省</div><div class="v">¥${money(Math.max(0, saving))}</div></div>
    </div>

    <div class="section-title">你的行程</div>
    <div class="table-wrap"><table>
      <thead><tr><th>行程</th><th>单程票价</th><th>每月次数</th><th>每月原价</th><th>路线</th></tr></thead>
      <tbody>${legRows}</tbody>
    </table></div>

    <div class="section-title">四档计次票对比</div>
    <div class="table-wrap"><table>
      <thead><tr><th>方案</th><th>买票总价</th><th>不买票</th><th>结论</th></tr></thead>
      <tbody>${packRows}</tbody>
    </table></div>

    <div class="note">
      <b>怎么算的：</b>先按最短路径算单程票价，再按每月实际次数累计；不买票时，同一支付渠道当月满 90 元后享 9 折。计次票不与 9 折、公交换乘优惠同享。<br>
      <b>注意：</b>计次票激活后 30 个自然日内有效、实名不可转让；本结果假设你一个月内能用完，用不完会浪费。票价只按地铁线路计算，不含磁浮线、市域机场线等单独计价线路；实际票价以官方查询和闸机扣费为准。
    </div>
  `;
  result.scrollIntoView({behavior:'smooth', block:'start'});
}

function calculate() {
  clearError();
  const start = resolveStation(document.getElementById('start').value);
  const end = resolveStation(document.getElementById('end').value);
  if (!start) return showError('起点站没识别出来，请从下拉列表里选一个上海地铁站名。');
  if (!end) return showError('终点站没识别出来，请从下拉列表里选一个上海地铁站名。');
  if (start === end) return showError('起点和终点是同一站，换一个终点吧。');

  const days = parseInt(document.getElementById('days').value, 10);
  const trips = parseInt(document.getElementById('trips').value, 10);
  if (!days || days < 1 || days > 31) return showError('每月通勤天数请填 1–31。');
  if (!trips || trips < 1 || trips > 4) return showError('每天往返次数请填 1–4。');

  const dests = [];
  document.querySelectorAll('.dest-row').forEach(row => {
    const raw = row.querySelector('.dest-station').value.trim();
    const visits = parseInt(row.querySelector('.dest-visits').value, 10);
    if (!raw) return;
    const station = resolveStation(raw);
    if (!station) throw new Error(`常去站点“${raw}”没识别出来，请从下拉列表里选。`);
    if (visits > 0) dests.push({station, visits});
  });

  try {
    const legs = buildLegs(start, end, days * trips, dests);
    render(legs, start, end);
  } catch (err) {
    showError(err.message);
  }
}

document.getElementById('addDest').addEventListener('click', () => addDestRow());
document.getElementById('calc').addEventListener('click', calculate);
document.getElementById('start').addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
document.getElementById('end').addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });

seedDatalist();
addDestRow('', 4);

  document.getElementById('start').value = '莘庄';
  document.getElementById('end').value = '人民广场';
  document.getElementById('days').value = 22;
  document.getElementById('trips').value = 2;
  const list = document.getElementById('destList');
  list.innerHTML = '';
  addDestRow('徐家汇', 4);
  addDestRow('陆家嘴', 2);
  calculate();
});
</script>
